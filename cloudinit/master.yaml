#cloud-config
hostname: master
fqdn: master
manage_etc_hosts: false

package_update: true
packages:
  - openmpi
  - openmpi-devel
  - iperf3
  - hwloc
  - numactl
  - python3
  - rsync

users:
  - name: rocky
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${cluster_pub}

write_files:
  - path: /etc/profile.d/openmpi.sh
    permissions: '0644'
    content: |
      export PATH=/usr/lib64/openmpi/bin:$PATH
      export LD_LIBRARY_PATH=/usr/lib64/openmpi/lib:$${LD_LIBRARY_PATH:-}

  - path: /home/rocky/.ssh/id_ed25519
    owner: rocky:rocky
    permissions: '0600'
    content: |
      ${cluster_priv}

  - path: /home/rocky/.ssh/config
    owner: rocky:rocky
    permissions: '0600'
    content: |
      Host ${ssh_host_patterns}
        User rocky
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
        IdentitiesOnly yes
        IdentityFile ~/.ssh/id_ed25519

  - path: /etc/hosts
    permissions: '0644'
    content: |
      127.0.0.1   localhost
      ${hosts_file}

  - path: /usr/local/bin/cluster-wait
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      for h in ${worker_hosts}; do
        until timeout 3 bash -lc "echo | ssh -o BatchMode=yes -o StrictHostKeyChecking=no $h 'true'"; do
          sleep 2
        done
      done

  - path: /usr/local/bin/cluster-check
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      LOG="/home/rocky/cluster-verify.log"
      exec > >(tee -a "$LOG") 2>&1
      echo "== Ping mgmt =="
      for h in master ${worker_hosts}; do ping -c 2 "$h" || true; done
      echo "== Ping mpi =="
      for h in ${mpi_hostnames}; do ping -c 2 "$h" || true; done
      echo "== SSH hostname via mgmt =="
      for h in ${worker_hosts}; do
        echo "-- $h --"
        ssh -o StrictHostKeyChecking=no "$h" "hostname && ip -4 -br addr | egrep '192.168.10|192.168.20'" || echo "SSH to $h failed"
      done
      echo "== MPI sanity (${mpi_rank_count} ranks) =="
      cat >/home/rocky/hello.c <<'EOC'
      #include <mpi.h>
      #include <stdio.h>
      #include <unistd.h>
      int main(int argc,char**argv){
        MPI_Init(&argc,&argv);
        int rank,size;
        char host[128];
        MPI_Comm_rank(MPI_COMM_WORLD,&rank);
        MPI_Comm_size(MPI_COMM_WORLD,&size);
        gethostname(host,sizeof(host));
        printf("hello from rank %d of %d on %s\n", rank, size, host);
        MPI_Finalize();
        return 0;
      }
      EOC
      cat >/home/rocky/mpi.hosts <<'EOC'
      ${mpi_hosts_file}
      EOC
      chown rocky:rocky /home/rocky/hello.c /home/rocky/mpi.hosts
      . /etc/profile.d/openmpi.sh
      mpicc -O2 -o /home/rocky/hello /home/rocky/hello.c
      mpirun --mca btl_tcp_if_include enp3s0 --mca oob_tcp_if_include enp3s0 -np ${mpi_rank_count} --hostfile /home/rocky/mpi.hosts /home/rocky/hello
      echo "OK: connectivity and MPI baseline look good."

  - path: /etc/systemd/system/cluster-verify.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Verify cluster connectivity after first boot
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=rocky
      Environment=HOME=/home/rocky
      WorkingDirectory=/home/rocky
      ExecStart=/bin/bash -lc '/usr/local/bin/cluster-wait && /usr/local/bin/cluster-check'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  - [ bash, -lc, "sudo sed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config" ]
  - [ bash, -lc, "sudo sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config" ]
  - [ bash, -lc, "echo 'AddressFamily inet' | sudo tee -a /etc/ssh/sshd_config" ]
  - [ bash, -lc, "sudo systemctl reload sshd || sudo systemctl reload ssh" ]
  - [ bash, -lc, "sudo systemctl disable --now firewalld || true" ]
  - [ bash, -lc, "sudo systemctl daemon-reload" ]
  - [ bash, -lc, "sudo systemctl enable --now cluster-verify.service" ]
  - [ bash, -lc, "chown -R rocky:rocky /home/rocky/.ssh" ]
