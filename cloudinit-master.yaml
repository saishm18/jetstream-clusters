#cloud-config
package_update: true
packages:
  - epel-release
  - dnf-plugins-core
  - openmpi
  - openmpi-devel
  - munge
  - munge-libs
  - munge-devel
  - slurm
  - slurm-slurmd
  - slurm-slurmctld
  - iperf3
  - nc

users:
  - name: rocky
    ssh_authorized_keys:
      - ${cluster_pub}

write_files:
  - path: /home/rocky/.ssh/id_ed25519
    owner: rocky:rocky
    permissions: '0600'
    content: |
      ${cluster_priv}

  - path: /home/rocky/.ssh/config
    owner: rocky:rocky
    permissions: '0600'
    content: |
      Host 192.168.10.* 192.168.20.*
        User rocky
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
        IdentitiesOnly yes
        IdentityFile ~/.ssh/id_ed25519

  - path: /etc/hosts
    permissions: '0644'
    content: |
      127.0.0.1   localhost
      ${hosts_file}

  - path: /etc/slurm/slurm.conf
    owner: root:root
    permissions: '0644'
    content: |
      ClusterName=indyssc
      SlurmctldHost=master
      AuthType=auth/munge
      SlurmUser=slurm
      StateSaveLocation=/var/spool/slurmctld
      SlurmdSpoolDir=/var/spool/slurmd
      SwitchType=switch/none
      MpiDefault=none
      SlurmctldPort=6817
      SlurmdPort=6818
      ProctrackType=proctrack/cgroup
      ReturnToService=2
      SlurmctldTimeout=60
      SlurmdTimeout=60
      SchedulerType=sched/backfill
      SelectType=select/cons_res
      SelectTypeParameters=CR_Core
      NodeName=worker[1-4] CPUs=${worker_cpus} State=UNKNOWN
      PartitionName=main Nodes=worker[1-4] Default=YES MaxTime=INFINITE State=UP

  - path: /usr/local/bin/cluster-check
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      echo "== Ping mgmt =="
      for h in master worker1 worker2 worker3 worker4; do ping -c 2 $(getent ahostsv4 $h | awk '{print $1; exit}'); done
      echo "== Ping mpi =="
      for h in master-mpi worker1-mpi worker2-mpi worker3-mpi worker4-mpi; do ping -c 2 $(getent ahostsv4 $h | awk '{print $1; exit}'); done
      echo "== SSH hostname via mgmt =="
      for h in worker1 worker2 worker3 worker4; do ssh $h "hostname && ip -4 -br addr | egrep '192.168.10|192.168.20'"; done
      echo "== Slurm sanity =="
      sinfo || true
      srun -N2 -n2 hostname
      echo "== MPI sanity (2 ranks) =="
      cat >/tmp/pp.c <<'EOC'
      #include <mpi.h>
      #include <stdio.h>
      int main(int argc,char**argv){MPI_Init(&argc,&argv);int r;MPI_Comm_rank(MPI_COMM_WORLD,&r);
      int p;MPI_Comm_size(MPI_COMM_WORLD,&p);printf("hello from rank %d/%d\n",r,p);MPI_Finalize();return 0;}
      EOC
      mpicc -O2 -o /tmp/pp /tmp/pp.c
      mpirun -np 2 --host master-mpi,worker1-mpi /tmp/pp
      echo "OK: cluster looks good."
runcmd:
  - [ bash, -lc, "sudo sed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config" ]
  - [ bash, -lc, "sudo sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config" ]
  - [ bash, -lc, "echo 'AddressFamily inet' | sudo tee -a /etc/ssh/sshd_config" ]
  - [ bash, -lc, "sudo systemctl reload sshd || sudo systemctl reload ssh" ]
  - [ bash, -lc, "id -u munge >/dev/null 2>&1 || sudo useradd -r -s /sbin/nologin munge" ]
  - [ bash, -lc, "id -u slurm >/dev/null 2>&1 || sudo useradd -r -s /sbin/nologin slurm" ]
  - [ bash, -lc, "sudo mkdir -p /var/spool/slurmctld /var/spool/slurmd; sudo chown -R slurm:slurm /var/spool/slurmctld /var/spool/slurmd" ]
  - [ bash, -lc, "sudo /usr/sbin/munge-keygen --create --keyfile /etc/munge/munge.key" ]
  - [ bash, -lc, "sudo chown munge:munge /etc/munge/munge.key; sudo chmod 400 /etc/munge/munge.key" ]
  - [ bash, -lc, "sudo systemctl enable --now munge" ]
  - [ bash, -lc, "for h in worker1 worker2 worker3 worker4; do for i in {1..30}; do ssh -o StrictHostKeyChecking=no $h 'true' && break; sleep 2; done; done" ]
  - [ bash, -lc, "for h in worker1 worker2 worker3 worker4; do scp /etc/munge/munge.key $h:/tmp/; ssh $h 'sudo mv /tmp/munge.key /etc/munge/munge.key && sudo chown munge:munge /etc/munge/munge.key && sudo chmod 400 /etc/munge/munge.key'; done" ]
  - [ bash, -lc, "for h in worker1 worker2 worker3 worker4; do scp /etc/slurm/slurm.conf $h:/tmp/; ssh $h 'sudo mv /tmp/slurm.conf /etc/slurm/slurm.conf'; done" ]
  - [ bash, -lc, "sudo systemctl enable --now slurmctld || true" ]
  - [ bash, -lc, "for h in worker1 worker2 worker3 worker4; do ssh $h 'sudo systemctl enable --now munge slurmd'; done" ]
  - [ bash, -lc, "echo 'export PATH=/usr/lib64/openmpi/bin:$PATH' | sudo tee /etc/profile.d/mpi.sh" ]
  - [ bash, -lc, "echo 'export LD_LIBRARY_PATH=/usr/lib64/openmpi/lib:$LD_LIBRARY_PATH' | sudo tee -a /etc/profile.d/mpi.sh" ]
  - [ bash, -lc, "chown -R rocky:rocky /home/rocky/.ssh" ]
